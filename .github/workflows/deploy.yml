name: Deploy site

# Slimmed-down version of al-folio's deploy workflow.
# Removed (unused on this site): npm ci (test-only devDependencies), Python/nbconvert
# (Jupyter posts), ImageMagick (responsive images are disabled in _config.yml),
# and the giscus config step (no comments).

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "docs/**"
      - "AGENTS.md"
      - "CLAUDE.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true
      - name: Build 🔧
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production
      - name: Purge unused CSS 🧹
        run: npx --yes purgecss -c purgecss.config.js
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
